<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold for 2x</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1><img src="../icons/icon48.png" alt="">Hold for 2x</h1>

    <section class="card" aria-labelledby="speed-label">
      <p class="label" id="speed-label">Speed while holding</p>
      <div class="stepper">
        <button type="button" id="dec" aria-label="Slower">&minus;</button>
        <label class="readout">
          <input id="speed" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-labelledby="speed-label">
          <span aria-hidden="true">x</span>
        </label>
        <button type="button" id="inc" aria-label="Faster">+</button>
      </div>
    </section>

    <p class="hint" id="hint" aria-live="polite">Hold the mouse on a playing video, or hold the space bar, to speed it up. Let go to return to normal. Pick anything from 1.25x to 4x.</p>

    <p class="keys">
      <span><kbd>[</kbd>Slower</span>
      <span><kbd>]</kbd>Faster</span>
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
